<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Author" content="Dante Ariel Agustin Benjamin Diego :D">
    <title>JunaWeb - Registro de Alumnos</title>

    <link rel="stylesheet" href="static/css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https: //fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>


    <header class="navbar">
        <div class="header-content">

            <div class="official-logo">
            </div>
            <img src="static/images/Logo_del_MINSAL_Chile.png" alt="Ministerio">
            <div class="logo">
                <span>JunaWeb</span>
            </div>
            <nav>
                <a href="#">Inicio</a>
                <a href="#">Soporte</a>
            </nav>
        </div>
    </header>


    <main class="container">
        <div class="card">
            <div class="card-header">
                <h2>Registro de Alumnos</h2>
                <p>Ingresa tus datos institucionales para crear tu cuenta</p>
            </div>

            <form class="register-form" action="#" method="POST">

                <div class="form-group">
                    <label for="rut">RUT del Estudiante</label>
                    <input type="text" id="rut" name="rut" placeholder="12.345.678-K" required>
                    <small>Formato con puntos y guion</small>
                </div>


                <div class="form-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" required>
                </div>


                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email"id="email"name="email"placeholder="estudiante@junaweb.cl"required>
                </div>


                <div class="form-group">
                    <label for="curso">Curso / Nivel</label>
                    <select id="curso" name="curso" required>
                        <option value="" disabled selected>Selecciona tu curso</option>
                        <option value="1m">1° Medio</option>
                        <option value="2m">2° Medio</option>
                        <option value="3m">3° Medio</option>
                        <option value="4m">4° Medio</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-primary">Registrarse</button>
            </form>

            <div class="card-footer">
                <p>¿Ya tienes una cuenta? <a href="#">Inicia sesión aquí</a></p>
            </div>
        </div>
    </main>

    <footer>
        <p> &copy; 2026 Colegio JunaWeb. Todos los derechos reservados.</p>
    </footer>

</body>


</html>
