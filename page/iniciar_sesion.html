<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JunaWeb - Iniciar Sesión</title>
  <link rel="stylesheet" href="../static/css/inicio.css">
</head>
<body>

  <header>
    <a href="../index.html" class="logo">Juna<span>Web</span></a>
    <a href="registro.html" class="nav-link">Registrarse</a>
  </header>

  <main class="auth-container">
    <div class="auth-card">
      <h2>Inicia <span>Sesión</span></h2>
      <p class="subtitle">Ingresa tus datos para acceder a tu cuenta y reservar tu almuerzo.</p>

      <form action="#" method="POST">
        <div class="form-group">
          <label for="rut">RUT o Correo Institucional</label>
          <input type="text" id="rut" placeholder="Ej: 12.345.678-9" required>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-submit">Ingresar →</button>
      </form>

      <div class="auth-footer">
        ¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a>
      </div>
    </div>
  </main>

</body>
</html>
