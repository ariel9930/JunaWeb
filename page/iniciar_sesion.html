<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JunaWeb - Iniciar Sesión</title>
        <meta name="author" content="Ariel Faundez, Agustin sanchez, Dante Canales, Diego Valenzuela y Benjamin Carrasco">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/iniciar_sesion.css">
</head>
<body class="dark-theme d-flex flex-column min-vh-100 justify-content-center align-items-center py-4">

    <div class="login-container w-100 px-3" style="max-width: 450px;">
        <!-- Logo y Cabecera -->
        <div class="text-center mb-4">
            <a href="../index.html" class="d-inline-flex align-items-center text-decoration-none mb-2">
                <img src="../static/images/logo.png" alt="Logo JunaWeb" class="header-logo" style="height: 40px;">
                <span class="ms-2 fs-3 font-poppins fw-bold">
                    <span class="text-white">Juna</span><span class="text-accent">Web</span>
                </span>
            </a>
            <h5 class="text-white font-poppins fw-bold mb-1">Iniciar Sesión</h5>
            <p class="text-bright-sub font-inter xsmall">Identificación por RUT de Usuario</p>
        </div>

        <!-- Tarjeta de Formulario -->
        <div class="custom-card p-4 shadow-lg border-accent-glow">
            <div id="login-alert" class="alert d-none py-2 mb-3 font-inter xsmall text-center"></div>

            <form id="form-login" onsubmit="procesarLogin(event)">
                <!-- RUT DEL USUARIO -->
                <div class="mb-3 text-start">
                    <label for="login-rut" class="form-label text-bright-sub font-inter xsmall fw-bold">RUT DEL USUARIO</label>
                    <input type="text" class="form-control custom-input font-inter" id="login-rut" placeholder="Ej: 20.123.456-K" maxlength="12" required>
                </div>

                <!-- FICHA DE IDENTIFICACIÓN -->
                <div class="p-3 mb-3 border border-secondary rounded bg-dark text-start">
                    <h6 class="text-accent font-poppins fw-bold xsmall mb-2">FICHA DE IDENTIFICACIÓN</h6>
                    <p class="mb-1 font-inter xsmall text-bright-sub">Nombre Completo: <br><strong id="info-nombre" class="text-white fs-6">— Por identificar —</strong></p>
                    <div class="d-flex justify-content-between mt-2 font-inter xsmall text-bright-sub">
                        <div>RUT Identificado: <br><strong id="info-rut" class="text-white">—</strong></div>
                        <div>Rol en Sistema: <br><strong id="info-rol" class="text-accent">—</strong></div>
                    </div>
                    <div class="mt-2 font-inter xsmall text-bright-sub">
                        Curso / Área: <br><strong id="info-curso" class="text-white">—</strong>
                    </div>
                </div>

<div class="mb-4 text-start">
    <label for="login-password" class="form-label text-bright-sub font-inter xsmall fw-bold">CONTRASEÑA</label>
    <input type="password" class="form-control custom-input font-inter" id="login-password" placeholder="••••" minlength="4" required>
    <div class="form-text text-bright-sub xsmall mt-1">Mínimo 4 números.</div>
</div>

                <!-- BOTÓN INICIAR SESIÓN -->
                <button type="submit" class="btn btn-custom-primary w-100 py-2 font-poppins fw-bold glow-btn mb-3">
                    INGRESAR AL SISTEMA →
                </button>
            </form>

            <div class="text-center font-inter xsmall">
                <span class="text-bright-sub">¿No tienes cuenta?</span>
                <a href="registro.html" class="text-accent text-decoration-none fw-bold ms-1">Regístrate aquí</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/iniciar_sesion.js"></script>
</body>
</html>
