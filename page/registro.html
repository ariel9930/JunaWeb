<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JunaWeb - Registro</title>
    <meta name="author" content="Ariel Faundez, Agustin sanchez, Dante Canales, Diego Valenzuela y Benjamin Carrasco">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/registro.css">
</head>

<body class="dark-theme d-flex flex-column min-vh-100 justify-content-center align-items-center py-4">

    <div class="register-container w-100 px-3" style="max-width: 550px;">
        <!-- Logo y Cabecera -->
        <div class="text-center mb-4">
            <a href="../index.html" class="d-inline-flex align-items-center text-decoration-none mb-2">
                <img src="../static/images/logo.png" alt="Logo JunaWeb" class="header-logo" style="height: 40px;">
                <span class="ms-2 fs-3 font-poppins fw-bold">
                    <span class="text-white">Juna</span><span class="text-accent">Web</span>
                </span>
            </a>
            <h5 class="text-white font-poppins fw-bold mb-1">Registro de Usuario</h5>
            <p class="text-bright-sub font-inter xsmall">Crea tu cuenta para el sistema PAE</p>
        </div>

        <!-- Tarjeta de Formulario -->
        <div class="custom-card p-4 shadow-lg border-accent-glow">
            <div id="register-alert" class="alert d-none py-2 mb-3 font-inter xsmall text-center"></div>

            <form id="form-registro" onsubmit="procesarRegistro(event)">
                <!-- NOMBRE COMPLETO -->
                <div class="mb-3 text-start">
                    <label for="reg-nombre" class="form-label text-bright-sub font-inter xsmall fw-bold">NOMBRE
                        COMPLETO</label>
                    <input type="text" class="form-control custom-input font-inter" id="reg-nombre"
                        placeholder="Ej: Juan Pérez" required>
                </div>

                <!-- RUT -->
                <div class="mb-3 text-start">
                    <label for="reg-rut" class="form-label text-bright-sub font-inter xsmall fw-bold">RUT</label>
                    <input type="text" class="form-control custom-input font-inter" id="reg-rut"
                        placeholder="Ej: 20.123.456-K" maxlength="12"
                        oninput="this.value = this.value.replace(/[^0-9kK\.\,-]/g, '')" required>
                </div>

                <!-- CURSO / ÁREA -->
                <div class="mb-3 text-start">
                    <label for="reg-curso" class="form-label text-bright-sub font-inter xsmall fw-bold">CURSO /
                        ÁREA</label>
                    <input type="text" class="form-control custom-input font-inter" id="reg-curso"
                        placeholder="Ej: 4° Medio A" required>
                </div>

                <!-- CONTRASEÑA -->
                <div class="mb-4 text-start">
                    <label for="reg-password"
                        class="form-label text-bright-sub font-inter xsmall fw-bold">CONTRASEÑA</label>
                    <input type="password" class="form-control custom-input font-inter" id="reg-password"
                        placeholder="••••" minlength="4" required>
                </div>

                <!-- BOTÓN REGISTRARSE -->
                <button type="submit" class="btn btn-custom-primary w-100 py-2 font-poppins fw-bold glow-btn mb-3">
                    CREAR CUENTA →
                </button>
            </form>


            <div class="text-center font-inter xsmall mb-3">
                <span class="text-bright-sub">¿Ya tienes cuenta?</span>
                <a href="iniciar_sesion.html" class="text-accent text-decoration-none fw-bold ms-1">Inicia sesión
                    aquí</a>
            </div>

            <!-- BOTÓN VOLVER AL INICIO -->
            <div class="text-center pt-2 border-top border-secondary border-opacity-25">
                <a href="../index.html"
                    class="btn btn-custom-outline w-100 py-2 font-poppins xsmall fw-bold text-decoration-none">
                    ← VOLVER AL INICIO
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/registro.js"></script>
</body>

</html>
