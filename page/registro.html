<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JunaWeb - Registro</title>
  <link rel="stylesheet" href="../static/css/registro.css">
</head>
<body>

  <header>
    <a href="../index.html" class="logo">Juna<span>Web</span></a>
    <a href="iniciar_sesion.html" class="nav-link">Iniciar Sesión</a>
  </header>

  <main class="auth-container">
    <div class="auth-card">
      <h2>Crea tu <span>Cuenta</span></h2>
      <p class="subtitle">Registrate para gestionar tus reservas de alimentación escolar.</p>

      <form action="#" method="POST">
        <div class="form-group">
          <label for="fullname">Nombre Completo</label>
          <input type="text" id="fullname" placeholder="Ej: Benjamin Carrasco" required>
        </div>

        <div class="form-group">
          <label for="rut">RUT</label>
          <input type="text" id="rut" placeholder="12.345.678-9" required>
        </div>

        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" placeholder="estudiante@colegio.cl" required>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="Crea una contraseña segura" required>
        </div>

        <button type="submit" class="btn-submit">Crear Cuenta →</button>
      </form>

      <div class="auth-footer">
        ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
      </div>
    </div>
  </main>

</body>
</html>
