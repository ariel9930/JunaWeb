<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - PAEWeb</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../static/css/style.css">
    <style>
        /* Estilos adicionales para los inputs en tema oscuro */
        .form-control-dark, .form-select-dark {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px;
        }
        .form-control-dark:focus, .form-select-dark:focus {
            background-color: var(--bg-color);
            border-color: var(--accent-color);
            color: var(--text-main);
            box-shadow: 0 0 0 0.25rem rgba(0, 230, 118, 0.25);
        }
        .form-control-dark::placeholder {
            color: var(--text-muted);
        }
    </style>
</head>
<body class="d-flex align-items-center min-vh-100 py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <!-- Logo -->
                <div class="text-center mb-4">
                    <span class="logo-icon me-2" style="width: 32px; height: 32px; vertical-align: middle;"></span>
                    <h2 class="d-inline align-middle fw-bold mb-0">PAE<span class="text-accent">Web</span></h2>
                </div>
                
                <!-- Register Card -->
                <div class="app-card p-4 p-md-5">
                    <h4 class="mb-4 text-center fw-bold">Crear Cuenta</h4>
                    <form action="login.html">
                        <div class="mb-3">
                            <label for="nombre" class="form-label text-muted small text-uppercase">Nombre Completo</label>
                            <input type="text" class="form-control form-control-dark" id="nombre" placeholder="Ej: Juan Pérez" required>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="rut" class="form-label text-muted small text-uppercase">RUT</label>
                                <input type="text" class="form-control form-control-dark" id="rut" placeholder="Ej: 12.345.678-9" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="perfil" class="form-label text-muted small text-uppercase">Perfil</label>
                                <select class="form-select form-select-dark" id="perfil" required>
                                    <option value="" disabled selected>Seleccione...</option>
                                    <option value="alumno">Alumno</option>
                                    <option value="supervisor">Supervisor</option>
                                    <option value="direccion">Dirección</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label text-muted small text-uppercase">Contraseña</label>
                            <input type="password" class="form-control form-control-dark" id="password" placeholder="Crea una contraseña segura" required>
                        </div>

                        <button type="submit" class="btn btn-accent w-100 mb-4">Registrarse</button>
                        
                        <div class="text-center">
                            <span class="text-muted small">¿Ya tienes una cuenta?</span> 
                            <a href="login.html" class="text-decoration-none text-accent fw-bold small">Inicia sesión</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
