<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - JunaWeb</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../static/css/style.css">
    <style>
        /* Estilos adicionales para los inputs en tema oscuro */
        .form-control-dark {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px;
        }
        .form-control-dark:focus {
            background-color: var(--bg-color);
            border-color: var(--accent-color);
            color: var(--text-main);
            box-shadow: 0 0 0 0.25rem rgba(136, 236, 188, 0.25);
        }
        .form-control-dark::placeholder {
            color: var(--text-muted);
        }
    </style>
</head>
<body class="d-flex align-items-center min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <!-- Logo -->
                <div class="text-center mb-4">
                    <span class="logo-icon me-2" style="width: 32px; height: 32px; vertical-align: middle;"></span>
                    <h2 class="d-inline align-middle fw-bold mb-0">PAE<span class="text-accent">Web</span></h2>
                </div>
                
                <!-- Login Card -->
                <div class="app-card p-4 p-md-5">
                    <h4 class="mb-4 text-center fw-bold">Iniciar Sesión</h4>
                    <form action="index.html">
                        <div class="mb-3">
                            <label for="rut" class="form-label text-muted small text-uppercase">RUT</label>
                            <input type="text" class="form-control form-control-dark" id="rut" placeholder="Ej: 12.345.678-9" required>
                        </div>
                        <div class="mb-4">
                            <div class="d-flex justify-content-between">
                                <label for="password" class="form-label text-muted small text-uppercase">Contraseña</label>
                                <a href="#" class="text-accent small text-decoration-none">¿Olvidaste tu clave?</a>
                            </div>
                            <input type="password" class="form-control form-control-dark" id="password" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-accent w-100 mb-4">Ingresar</button>
                        
                        <div class="text-center">
                            <span class="text-muted small">¿No tienes cuenta?</span> 
                            <a href="register.html" class="text-decoration-none text-accent fw-bold small">Regístrate aquí</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
